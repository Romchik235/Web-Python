<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Стоматологічний кабінет</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f8fd; color: #333; }
        nav { background: #1a5276; padding: 12px 30px; display: flex; align-items: center; gap: 20px; }
        nav a { color: white; text-decoration: none; font-size: 15px; padding: 6px 12px; border-radius: 4px; }
        nav a:hover { background: rgba(255,255,255,0.2); }
        nav .brand { font-size: 18px; font-weight: bold; margin-right: auto; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        h1 { color: #1a5276; margin-bottom: 20px; }
        h2 { color: #2874a6; margin: 15px 0 10px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        th { background: #2874a6; color: white; padding: 10px 14px; text-align: left; }
        td { padding: 10px 14px; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #eaf4fb; }
        .badge { padding: 3px 10px; border-radius: 10px; font-size: 13px; }
        .badge-plan { background: #d6eaf8; color: #1a5276; }
        .badge-done { background: #d5f5e3; color: #1e8449; }
        .badge-cancel { background: #fadbd8; color: #922b21; }
        a { color: #2874a6; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .card p { margin: 8px 0; }
        .card .label { font-weight: bold; color: #1a5276; }
    </style>
</head>
<body>
<nav>
    <span class="brand">🦷 Стоматологічний кабінет</span>
    <a href="{% url 'home' %}">Головна</a>
    <a href="{% url 'doctors' %}">👨‍⚕️ Лікарі</a>
    <a href="{% url 'patients' %}">🧑 Пацієнти</a>
    <a href="{% url 'appointments' %}">📅 Прийоми</a>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
