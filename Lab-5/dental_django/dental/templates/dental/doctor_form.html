{% extends "dental/base.html" %}
{% block content %}
<h1>{% if action == 'Редагувати' %}✏️ Редагувати лікаря{% else %}➕ Додати лікаря{% endif %}</h1>
<form method="post" style="background:white;padding:24px;border-radius:8px;max-width:500px;box-shadow:0 2px 8px rgba(0,0,0,.08)">
  {% csrf_token %}
  {% for field in form %}
  <div style="margin-bottom:14px">
    <label style="display:block;font-weight:bold;margin-bottom:4px">{{ field.label }}</label>
    {{ field }}
    {% if field.errors %}<p style="color:red;font-size:13px">{{ field.errors.0 }}</p>{% endif %}
  </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">Зберегти</button>
  <a href="/doctors/?role={{ role }}" style="margin-left:10px">← Скасувати</a>
</form>
{% endblock %}
